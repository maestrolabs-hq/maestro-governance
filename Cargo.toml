# The desired state of every repository in the organisation, and the drift from it.
#
# Split into a library and a binary so the comparison half can be tested
# without a network: `governance` is pure text-in, drift-out, and the binary
# owns everything that shells out to `gh`. A test that needs a network is a
# test that gets disabled.

[package]
name = "maestro-governance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Desired state for the repositories, and the drift from it"

[lib]
name = "governance"
path = "src/lib.rs"

[[bin]]
name = "governance"
path = "src/main.rs"

# No application dependencies. GitHub is reached through the `gh` CLI, which
# already holds the credentials and the API surface; a crate would add a
# second auth path for no gain.
[dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
